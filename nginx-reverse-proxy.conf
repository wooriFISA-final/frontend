#!/bin/bash

# Frontend EC2 인스턴스의 Nginx 설정 파일
# /etc/nginx/sites-available/woorizip.info

# ============================================
# HTTP → HTTPS 리디렉션
# ============================================
server {
    listen 80;
    server_name woorizip.info www.woorizip.info;
    
    # Let's Encrypt 인증용
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    
    # 나머지는 HTTPS로 리디렉션
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ============================================
# HTTPS - Main Server
# ============================================
server {
    listen 443 ssl http2;
    server_name woorizip.info www.woorizip.info;

    # SSL 인증서 (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/woorizip.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/woorizip.info/privkey.pem;
    
    # SSL 설정 (Mozilla Modern)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;
    
    # 보안 헤더
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # ============================================
    # Frontend (React 앱)
    # ============================================
    location / {
        # Docker 컨테이너로 프록시 (포트 8888에서 실행 중)
        proxy_pass http://localhost:8888;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # ============================================
    # Backend API (Private Subnet)
    # ============================================
    location /api/ {
        # Backend Private IP로 프록시
        # TODO: 실제 Backend Private IP로 변경하세요
        proxy_pass http://10.0.2.10:8000/;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS 헤더 (Backend에서도 설정하지만 안전장치)
        add_header Access-Control-Allow-Origin "https://woorizip.info" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Credentials "true" always;
        
        # Preflight 요청 처리
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        
        # 타임아웃 설정
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # ============================================
    # Agent API (Private Subnet)
    # ============================================
    location /agent/ {
        # Agent Private IP로 프록시
        # TODO: 실제 Agent Private IP로 변경하세요
        proxy_pass http://10.0.2.20:8080/;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS 헤더
        add_header Access-Control-Allow-Origin "https://woorizip.info" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Credentials "true" always;
        
        # Preflight 요청 처리
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        
        # 타임아웃 설정 (Agent는 응답이 느릴 수 있음)
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
    
    # ============================================
    # Health Check
    # ============================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
